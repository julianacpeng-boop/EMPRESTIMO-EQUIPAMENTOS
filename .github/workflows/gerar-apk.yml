
name: Gerar APK - HNL Movimentações
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'saida/**'
permissions:
  contents: read
jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Cordova e dependências
        run: |
          npm install -g cordova@13.0.0
          npm install --no-audit --no-fund
          npm run prepare:web
          npm run test:static
      - name: Gerar projeto Android
        run: |
          cordova platform add android@15.0.0
          cordova prepare android
      - name: Gerar APK de teste
        run: cordova build android --debug
      - name: Copiar APK
        run: |
          mkdir -p saida
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk saida/HNL_Movimentacoes_debug.apk
          ls -lh saida/HNL_Movimentacoes_debug.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Movimentacoes-APK
          path: saida/HNL_Movimentacoes_debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
