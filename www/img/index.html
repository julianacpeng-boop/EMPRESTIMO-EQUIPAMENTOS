function fromStorage(key,backup){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:backup}catch(e){return backup}}

function device(e){const a=active(e.uid)||docs.find(r=>r.equipId===e.uid&&(['loaned','pending_delivery','pending_return'].includes(r.status)));return `<div class="device"><span class="icon">${esc(e.icon||'▣')}</span><div><b>${esc(e.name)}</b><span class="sub">${esc(e.brand)} • ${esc(e.model)}</span><br><span class="pill ${a?'amber':''}">${a?(a.status==='pending_delivery'?'ENTREGA PENDENTE':a.status==='pending_return'?'DEVOLUÇÃO EM TRANSPORTE':'EMPRESTADO'):'DISPONÍVEL'}</span></div></div><div class="facts"><div class="fact"><small>Patrimônio</small><strong>${esc(e.id)}</strong></div><div class="fact"><small>Nº de série</small><strong>${esc(e.serial)}</strong></div><div class="fact"><small>Setor de origem</small><strong>${esc(e.from)}</strong></div><div class="fact"><small>ID Arkmeds</small><strong>${esc(e.arkId)}</strong></div></div>`}
function choosePerson(name=''){return `<option value="">Selecione um profissional</option>${STAFF.map(a=>`<option value="${esc(a[0])}" ${name===a[0]?'selected':''}>${esc(a[0])} — ${esc(a[1])}</option>`).join('')}`}
function opts(except,selected=''){const areas=[...new Set([...AREAS,...catalog.map(x=>x.from).filter(Boolean),selected].filter(Boolean))].filter(x=>x!==except);return `<option value="">Selecione o setor</option>${areas.map(x=>`<option ${selected===x?'selected':''}>${esc(x)}</option>`).join('')}`}
function sigField(key,label){return `<div class="field">${label}<div class="signbox"><canvas width="600" height="226" data-sign="${key}" aria-label="Campo de assinatura ${esc(label)}"></canvas><div class="signfoot"><span>Assine com o dedo ou mouse</span><button type="button" data-clear="${key}">Limpar ✕</button></div></div></div>`}

function stats(){return `<div class="stats"><div class="stat"><b>${docs.filter(x=>['pending_delivery','pending_return'].includes(x.status)).length}</b><small>Aguardam 3ª assinatura</small></div><div class="stat"><b>${docs.filter(x=>x.status==='loaned').length}</b><small>Emprestados</small></div><div class="stat"><b>${docs.filter(x=>x.status==='returned').length}</b><small>Devolvidos</small></div></div>`}
function shortDoc(r){const e=eBy(r.equipId);const pendingReturn=r.status==='pending_return';return `<div class="record"><div class="recordtop"><b>${esc(e?.name||'Equipamento')}</b>${status(r)}</div><small><b>${esc(r.id)}</b> • Patr. ${esc(e?.id||'—')}<br>${esc(r.origin)} → ${esc(r.destination)}<br>${pendingReturn?`Retorno iniciado: ${when(r.returnStartedAt)}`:`Retirada: ${when(r.pickupAt)}`}</small><div class="recordactions"><button class="btn soft small" data-detail="${esc(r.id)}">Abrir documento</button>${r.status==='pending_delivery'?`<button class="btn primary small" data-receive="${esc(r.id)}">3ª assinatura da entrega</button>`:pendingReturn?`<button class="btn primary small" data-return-receive="${esc(r.id)}">3ª assinatura do retorno</button>`:r.status==='loaned'?`<button class="btn border small" data-ret="${esc(r.id)}">Devolver</button>`:''}</div></div>`}

function searchResults(q){let val=String(q||'').trim().toLocaleLowerCase('pt-BR');let rows=val?catalog.filter(e=>[e.id,e.serial,e.name,e.arkId].some(x=>String(x).toLocaleLowerCase('pt-BR').includes(val))):catalog.slice(0,5);return rows.length?rows.slice(0,25).map(e=>`<button class="mock" data-pick="${esc(e.uid)}"><span class="mini">${esc(e.icon||'▣')}</span><span><b>${esc(e.name)}</b><small>Patr. ${esc(e.id)} • Série ${esc(e.serial)}<br>${esc(e.from)} · ID ${esc(e.arkId)}</small></span><span class="pill ${active(e.uid)?'amber':''}">${active(e.uid)?'Em uso':'Abrir'}</span></button>`).join(''):'<div class="empty">Nenhum equipamento corresponde à busca. Importe ou confira o dicionário.</div>'}
function scanPage(){return `<div class="card"><div class="eyebrow">IDENTIFICAÇÃO DO EQUIPAMENTO</div><h2>Como deseja buscar?</h2><div class="segment"><button data-mode="search" class="${searchMode==='search'?'chosen':''}">⌕ Patrimônio / série</button><button data-mode="qr" class="${searchMode==='qr'?'chosen':''}">▦ QR Code</button></div>${searchMode==='search'?`<label class="field">Patrimônio ou número de série<input id="searchInput" type="search" placeholder="Digite o patrimônio ou nº de série" value="${esc(queryText)}" autocomplete="off"></label><div class="eyebrow" style="margin-top:15px">${queryText?'RESULTADOS':'EQUIPAMENTOS DE EXEMPLO'}</div><div id="matches">${searchResults(queryText)}</div>`:`<div class="qr-panel"><div class="qr-symbol">▦</div><h2>Ler etiqueta Arkmeds</h2><p class="sub">O aplicativo extrai o ID da URL, por exemplo <b>2528</b>, e consulta apenas o dicionário importado.</p><div class="toolbar"><button class="btn primary full" id="openCamera">Abrir câmera e ler QR Code</button></div><div id="reader" class="reader hidden"></div><label class="field" style="margin-top:15px">Ou cole a URL / ID do QR Code<input id="qrInput" placeholder="https://digit.arkmeds.com/.../2528/"></label><button class="btn soft full" id="resolveQr">Identificar pelo ID</button><button class="btn border full" style="margin-top:8px" id="qrDemo">Testar QR de exemplo: ID 2528</button><p class="sub" style="margin-bottom:0">A câmera depende da permissão do navegador e normalmente de HTTPS. A busca manual funciona sem câmera.</p></div>`}</div>${selected?selectedDevice():''}<div class="ios-help">${catalog.length} equipamentos no dicionário • <button data-tabgo="dictionary">Gerenciar planilha ›</button></div>`}

function pendingDetail(r){const e=eBy(r.equipId);return `<div class="card"><button class="back" id="backDocs">‹ Documentos</button><div class="eyebrow">DOCUMENTO SALVO • ${esc(r.id)}</div><h2>Retirada registrada</h2>${status(r)}<div class="notice" style="margin-top:12px">As duas assinaturas da origem estão armazenadas neste navegador. Ao chegar ao destino, toque em <b>Coletar 3ª assinatura</b>. O comprovante definitivo será exibido somente após a terceira assinatura.</div>${device(e)}<div class="facts"><div class="fact"><small>Origem</small><strong>${esc(r.origin)}</strong></div><div class="fact"><small>Destino</small><strong>${esc(r.destination)}</strong></div><div class="fact"><small>Retirada</small><strong>${when(r.pickupAt)}</strong></div><div class="fact"><small>Etapa</small><strong>2 de 3 assinaturas</strong></div></div><div class="section-title">Assinaturas salvas</div>${[['01 · Entrega na origem',r.loan.source],['02 · Transporte pela EC',r.loan.carrier]].map(([lbl,p])=>`<div class="saved-person"><strong>${esc(lbl)}</strong>${p.sig && p.sig!==MARK?`<img src="${p.sig}" alt="Assinatura salva">`:'<div class="sub">Assinatura fictícia de demonstração</div>'}<b>${esc(p.name)}</b><small>${esc(p.role)}</small></div>`).join('')}<button class="btn primary full" id="receiveDocument">Coletar 3ª assinatura no destino →</button><button class="btn danger full" style="margin-top:9px" id="deleteDocument">Excluir documento</button></div>`}

function returnForm(){let r=docs.find(x=>x.id===view.id),e=eBy(r.equipId);return `<div class="card"><button class="back" id="backDocument">‹ Voltar ao documento</button><div class="eyebrow">DEVOLUÇÃO • MESMO DOCUMENTO • ETAPA 1/2</div><h2>Retirada para devolução</h2>${stepper(1,2)}${device(e)}<div class="notice"><b>Salve as duas primeiras assinaturas antes de sair do setor.</b> Ao chegar ao setor de origem, abra este mesmo documento para coletar somente a terceira. Documento <b>${esc(r.id)}</b> • ${esc(r.destination)} → ${esc(r.origin)}.</div><form id="returnForm"><div class="section-title">04 · Quem entrega no setor de destino</div><div class="personblock"><label class="field">Setor que devolve<input readonly value="${esc(r.destination)}"></label><label class="field">Nome completo<input name="returnerName" placeholder="Quem entrega para devolução" required></label><label class="field">Função / cargo<input name="returnerRole" placeholder="Ex.: Enfermeiro(a)" required></label>${sigField('returner','Assinatura de quem devolve')}</div><div class="section-title">05 · Transporte pela Engenharia Clínica</div><div class="personblock"><label class="field">Profissional responsável<select name="returnCarrierName" id="carrierReturn" required>${choosePerson()}</select></label><label class="field">Função<input readonly name="returnCarrierRole" id="carrierReturnRole" placeholder="Preenchimento automático"></label>${sigField('returnCarrier','Assinatura de quem transporta')}</div><div class="toolbar"><button type="button" id="cancelReturn" class="btn border">Cancelar</button><button class="btn primary" type="submit">Salvar retorno e 2 assinaturas ✓</button></div></form></div>`}
function pendingReturnDetail(r){const e=eBy(r.equipId);return `<div class="card"><button class="back" id="backDocs">‹ Documentos</button><div class="eyebrow">DEVOLUÇÃO EM TRANSPORTE • ${esc(r.id)}</div><h2>Aguardando recebimento na origem</h2>${status(r)}<div class="notice" style="margin-top:12px">A entrega para devolução e o transporte pela Engenharia Clínica foram salvos. Ao chegar ao setor <b>${esc(r.origin)}</b>, toque em <b>Coletar 3ª assinatura do retorno</b>. O comprovante de devolução completo será liberado somente após a assinatura.</div>${device(e)}<div class="facts"><div class="fact"><small>Setor que devolveu</small><strong>${esc(r.destination)}</strong></div><div class="fact"><small>Setor que receberá</small><strong>${esc(r.origin)}</strong></div><div class="fact"><small>Retorno iniciado</small><strong>${when(r.returnStartedAt)}</strong></div><div class="fact"><small>Etapa</small><strong>2 de 3 assinaturas</strong></div></div><div class="section-title">Assinaturas do retorno já salvas</div>${[['04 · Entrega para devolução',r.returnInfo.returner],['05 · Transporte pela EC',r.returnInfo.carrier]].map(([lbl,p])=>`<div class="saved-person"><strong>${esc(lbl)}</strong>${p.sig && p.sig!==MARK?`<img src="${p.sig}" alt="Assinatura salva">`:'<div class="sub">Assinatura fictícia de demonstração</div>'}<b>${esc(p.name)}</b><small>${esc(p.role)}</small></div>`).join('')}<button class="btn primary full" id="receiveReturnDocument">Coletar 3ª assinatura do retorno →</button><div class="section-title">Comprovante do empréstimo original</div><p class="sub">O comprovante do empréstimo permanece disponível. A devolução só será incluída no cupom após o recebimento na origem.</p><div class="paperwrap">${receipt({...r,status:'loaned',returnInfo:null})}</div><div class="toolbar"><button class="btn border full" id="printReceipt">Exportar empréstimo / imprimir</button><button class="btn border full" id="downloadReceipt">Baixar comprovante HTML</button></div><button class="btn danger full" style="margin-top:9px" id="deleteDocument">Excluir documento</button></div>`}
function returnDelivery(){const r=docs.find(x=>x.id===view.id),e=eBy(r.equipId);return `<div class="card"><button class="back" id="backDocument">‹ Voltar ao documento</button><div class="eyebrow">DEVOLUÇÃO • MESMO DOCUMENTO • ETAPA 2/2</div><h2>Recebimento no setor de origem</h2>${stepper(2,2)}${device(e)}<div class="notice"><b>Assinaturas 04 e 05 já salvas.</b> Agora a pessoa que recebe no setor <b>${esc(r.origin)}</b> assina o mesmo documento. O empréstimo e a devolução serão encerrados somente nesta etapa.</div><form id="returnDeliveryForm"><div class="section-title">06 · Quem recebe no setor de origem</div><div class="personblock"><label class="field">Setor de origem<input readonly value="${esc(r.origin)}"></label><label class="field">Nome completo<input name="originReceiverName" placeholder="Quem recebe de volta" required></label><label class="field">Função / cargo<input name="originReceiverRole" placeholder="Ex.: Enfermeiro(a)" required></label>${sigField('originReceiver','Assinatura de quem recebe na origem')}</div><label class="field">Condições na devolução<select name="condition" required><option value="">Selecione a condição</option><option>Conferido, sem avarias aparentes</option><option>Com acessório pendente</option><option>Com avaria / requer avaliação técnica</option></select></label><label class="field">Observações da devolução<textarea name="returnNotes" placeholder="Anote condições e acessórios devolvidos..."></textarea></label><div class="toolbar"><button type="button" id="backReturnDelivery" class="btn border">‹ Voltar</button><button class="btn primary" type="submit">✓ Finalizar devolução</button></div></form></div>`}

ckup">↓ Exportar backup</button><label class="btn soft" for="backupFile">↑ Importar backup<input id="backupFile" type="file" accept=".json,application/json" hidden></label></div>${window.cordova?'<div class="section-title">Arquivos gerados no aplicativo</div><p class="sub">Os arquivos ficam na pasta Exportados do aplicativo até você compartilhar ou salvar uma cópia fora dele. São excluídos na desinstalação.</p><button class="btn soft full" id="listExports">▤ Consultar / compartilhar arquivos</button><div id="exportList"></div>':''}</div>`}
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
const ALIASES={from:['setor','localizacao','setordeorigem'],name:['nomedoequipamento','equipamento','nome'],brand:['marca'],model:['modelo'],serial:['numerodeserie','nserie','serie','serial'],id:['patrimonio','numeropatrimonio','patrimonial'],arkId:['id','idarkmeds','idequipamento','codigoarkmeds']};
function parseDelimited(text){const clean=String(text).replace(/^\uFEFF/,'');const first=clean.split(/\r?\n/,1)[0];let delim=[';',',','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[],row=[];let buf='',inQuote=false;for(let i=0;i<clean.length;i++){let c=clean[i];if(c==='"'){if(inQuote&&clean[i+1]==='"'){buf+='"';i++}else inQuote=!inQuote}else if(!inQuote&&c===delim){row.push(buf);buf=''}else if(!inQuote&&(c==='\n'||c==='\r')){if(c==='\r'&&clean[i+1]==='\n')i++;row.push(buf);if(row.some(x=>x.trim()))rows.push(row.slice());row.length=0;buf=''}else buf+=c}row.push(buf);if(row.some(x=>x.trim()))rows.push(row);return rows}
function convertRows(rows){if(!rows.length)throw Error('A planilha está vazia.');let headers=rows[0].map(normalize),idx={};for(const [key,aliases] of Object.entries(ALIASES)){idx[key]=headers.findIndex(h=>aliases.includes(h));if(idx[key]===-1)throw Error('Não foi encontrada a coluna obrigatória: '+({from:'setor',name:'nome do equipamento',brand:'marca',model:'modelo',serial:'número de série',id:'patrimônio',arkId:'id'}[key]))}
 const seenID=new Set(),seenPatr=new Set(),seenSerial=new Set(),out=[],errors=[];for(let i=1;i<rows.length;i++){let row=rows[i];if(!row||row.every(v=>String(v??'').trim()===''))continue;const e={};for(const key of Object.keys(idx))e[key]=String(row[idx[key]]??'').trim();if(Object.keys(idx).some(key=>!e[key])){errors.push('Linha '+(i+1)+': dados incompletos');continue}if(!/^\d+$/.test(e.arkId)){errors.push('Linha '+(i+1)+': ID não numérico');continue}const pat=e.id.toLowerCase(),ser=e.serial.toLowerCase();if(seenID.has(e.arkId)||seenPatr.has(pat)||seenSerial.has(ser)){errors.push('Linha '+(i+1)+': ID, patrimônio ou série duplicado');continue}seenID.add(e.arkId);seenPatr.add(pat);seenSerial.add(ser);e.uid='ark-'+e.arkId;e.icon='▤';out.push(e)}if(!out.length)throw Error('Nenhuma linha válida encontrada. '+errors.slice(0,3).join('; '));return {items:out,errors}}
async function importCatalog(file){if(!file)return;const ext=file.name.toLowerCase().split('.').pop();try{let rows;if(ext==='csv'||ext==='tsv'){rows=parseDelimited(await file.text())}else if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw Error('Leitor Excel não carregado. Conecte-se à internet ou salve a planilha como CSV e importe novamente.');const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}else throw Error('Arquivo não suportado. Use CSV, XLSX ou XLS.');const result=convertRows(rows);let msg='Importar '+result.items.length+' equipamento(s) e substituir o dicionário atual?';if(result.errors.length)msg+='\nAtenção: '+result.errors.length+' linha(s) inválida(s) serão ignoradas.\n'+result.errors.slice(0,4).join('\n');if(!confirm(msg))return;const old=catalog,oldName=importedName;catalog=result.items;importedName=file.name;if(!persistDict()){catalog=old;importedName=oldName;return}selected=null;toast(result.items.length+' equipamento(s) importado(s).');render()}catch(e){alert('Importação não realizada: '+e.message)}}
function parseArkId(raw){const v=String(raw||'').trim();if(/^\d+$/.test(v))return v;let url;try{url=new URL(v)}catch(e){throw Error('Informe um ID numérico ou uma URL da etiqueta Arkmeds.')};if(!['digit.arkmeds.com'].includes(url.hostname.toLowerCase())||!['https:','http:'].includes(url.protocol))throw Error('O QR Code não é do domínio digit.arkmeds.com.');const m=url.pathname.match(/^\/cadastros\/equipamento\/visual\/(\d+)\/?$/);if(!m)throw Error('A URL Arkmeds não contém um ID de equipamento válido.');return m[1]}
function resolveQr(raw){let id;try{id=parseArkId(raw)}catch(e){toast(e.message);return}const found=catalog.find(e=>e.arkId===id);if(!found){toast('ID '+id+' não encontrado. Importe a linha correspondente na planilha.');return}selected=found.uid;stopCamera();go(null,'scan');toast('ID '+id+' localizado no dicionário: '+found.name);setTimeout(()=>query('#identified')?.scrollIntoView({behavior:'smooth',block:'nearest'}),80)}
async function startCamera(){if(qrScanner||qrStarting)return;qrStarting=true;try{if(window.cordova && window.cordova.plugins && window.cordova.plugins.permissions){const cp=window.cordova.plugins.permissions;const ok=await new Promise(resolve=>{cp.checkPermission(cp.CAMERA, state=>{if(state.hasPermission)return resolve(true);cp.requestPermission(cp.CAMERA, result=>resolve(Boolean(result.hasPermission)),()=>resolve(false))},()=>resolve(false))});if(!ok)throw Error('Permissão de câmera não concedida.')}if(!window.Html5Qrcode){throw Error('Leitor de câmera indisponível. Verifique a conexão ou cole a URL do QR Code.')};query('#reader')?.classList.remove('hidden');qrScanner=new Html5Qrcode('reader');await qrScanner.start({facingMode:'environment'},{fps:8,qrbox:{width:220,height:220}},decoded=>resolveQr(decoded));toast('Aponte a câmera para o QR Code da Arkmeds.')}catch(e){query('#reader')?.classList.add('hidden');qrScanner=null;toast('Não foi possível abrir a câmera. Use a URL manual.')}finally{qrStarting=false}}
async function stopCamera(){const scanner=qrScanner;qrScanner=null;if(!scanner)return;try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){}}

function resolveStaff(name){return STAFF.find(x=>x[0]===name)?.[1]||''}
const sigs={};function setupSignatures(){all('canvas[data-sign]').forEach(canvas=>{const key=canvas.dataset.sign,ctx=canvas.getContext('2d');sigs[key]=false;ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1255a6';let drawing=false;const pt=ev=>{const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*canvas.width/r.width,y:(ev.clientY-r.top)*canvas.height/r.height}};canvas.onpointerdown=ev=>{ev.preventDefault();drawing=true;canvas.setPointerCapture(ev.pointerId);const p=pt(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.12,p.y+.12);ctx.stroke();sigs[key]=true};canvas.onpointermove=ev=>{if(!drawing)return;ev.preventDefault();const p=pt(ev);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false}});all('[data-clear]').forEach(b=>b.onclick=()=>{const c=query(`canvas[data-sign="${b.dataset.clear}"]`);c.getContext('2d').clearRect(0,0,c.width,c.height);sigs[b.dataset.clear]=false})}
function signature(key){const c=query(`canvas[data-sign="${key}"]`);return c&&sigs[key]?c.toDataURL('image/png'):null}
function requireSigs(keys){const absent=keys.find(x=>!signature(x));if(absent){toast('Preencha todas as assinaturas para salvar.');query(`canvas[data-sign="${absent}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return false}return true}

function fileErrorMessage(error){return String(error?.message||error?.code||error||'erro desconhecido')}

function listSavedExports(){

function downloadBlob(filename,content,mime){
 if(window.cordova){
  getExportDirectory(dir=>dir.getFile(filename,{create:true},entry=>entry.createWriter(writer=>{

   writer.truncate(0);
  },error=>alert('Não foi possível preparar '+filename+': '+fileErrorMessage(error))),error=>alert('Não foi possível criar '+filename+': '+fileErrorMessage(error))),error=>alert('Não foi possível acessar a pasta Exportados: '+fileErrorMessage(error)));
  return;
